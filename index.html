<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loanitol EMI Calculator</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  <style>
    /*=============================
      COLORS & BASE STYLES
    =============================*/
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    :root {
      /* Loanitol Branding */
      --primary: #0F2133;    /* Dark‐blue from the “Loanitol” text */
      --secondary: #E31F26;  /* Bright red from the logo shape */
      --light-bg: #F7F8FA;   /* Very light gray for card backgrounds */
      --dark-text: #2C3E50;  /* Dark gray for normal text */
      --warning: #E74C3C;    /* Red for warnings */
      --card-bg: #FFFFFF;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    body {
      background: linear-gradient(135deg, #0F2133, #E31F26);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      overflow: hidden;
    }

    /*=============================
      HEADER
    =============================*/
    .header {
      background: var(--primary);
      color: white;
      text-align: center;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .header img {
      height: 50px;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 600;
    }

    .header p {
      font-size: 1rem;
      opacity: 0.9;
      margin-top: 4px;
    }

    /*=============================
      CONTENT AREA
    =============================*/
    .content {
      padding: 30px;
      background: var(--light-bg);
    }

    .form-container {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px var(--shadow);
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 22px;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--dark-text);
      font-size: 1.05rem;
    }

    .input-container {
      display: flex;
      align-items: center;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      background: white;
    }

    .input-container i {
      width: 45px;
      text-align: center;
      color: var(--primary);
      font-size: 1.1rem;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: none;
      outline: none;
      font-size: 1.05rem;
      color: var(--dark-text);
      background: transparent;
    }

    select {
      cursor: pointer;
      background: white;
    }

    .radio-group {
      display: flex;
      gap: 25px;
      margin-top: 8px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .radio-option input[type="radio"] {
      width: auto;
      margin-right: 5px;
      accent-color: var(--primary);
    }

    .warning {
      color: var(--warning);
      font-size: 0.9rem;
      margin-top: 6px;
      min-height: 20px;
      padding-left: 5px;
    }

    .btn-calculate {
      background: var(--secondary);
      color: white;
      border: none;
      padding: 15px 25px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: block;
      width: 100%;
      transition: all 0.3s ease;
      margin-top: 15px;
    }

    .btn-calculate:hover {
      background: #C41C20;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(227, 31, 38, 0.3);
    }

    /*=============================
      RESULTS
    =============================*/
    .result-container {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px var(--shadow);
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      padding: 18px 0;
      border-bottom: 1px solid #eee;
    }

    .result-item:last-child {
      border-bottom: none;
    }

    .result-label {
      font-weight: 600;
      color: var(--dark-text);
      font-size: 1.1rem;
    }

    .result-value {
      font-weight: 700;
      font-size: 1.3rem;
      color: var(--primary);
    }

    .emi-highlight {
      color: var(--secondary);
      font-size: 1.4rem;
    }

    .info-text {
      text-align: center;
      margin-top: 25px;
      padding: 15px;
      background: #E8F4FD;
      border-radius: 8px;
      color: #0F2133;
      font-size: 0.95rem;
    }

    @media (max-width: 600px) {
      .content {
        padding: 20px;
      }

      .form-container,
      .result-container {
        padding: 20px;
      }

      .header h1 {
        font-size: 1.6rem;
      }

      .radio-group {
        flex-direction: column;
        gap: 10px;
      }

      .result-item {
        flex-direction: column;
        gap: 8px;
      }
    }

    .result-item.highlight {
      background: #FCEAEA;
      border-radius: 8px;
      padding: 20px;
      margin: 10px -10px;
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- ========== HEADER with Logo ========== -->
    <div class="header">
      <!-- Place your logo file in the same folder and name it 'Loanitol.png' -->
      <img src="Loanitol.png" alt="Loanitol Logo" />
      <div>
        <h1>Loanitol EMI Calculator</h1>
        <p>“We loan it all”</p>
      </div>
    </div>

    <!-- ========== MAIN CONTENT ========== -->
    <div class="content">
      <!-- ===== FORM ===== -->
      <div class="form-container">
        <!-- Loan Type -->
        <div class="form-group">
          <label for="loanType">Loan Type</label>
          <div class="input-container">
            <i class="fas fa-briefcase"></i>
            <select id="loanType">
              <option value="Personal Loan">Personal Loan</option>
              <option value="Home Loan">Home Loan</option>
              <option value="Property Loan">Property Loan</option>
              <option value="Business Loan">Business Loan</option>
            </select>
          </div>
        </div>

        <!-- Income Type -->
        <div class="form-group">
          <label>Income Type</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="incomeType" value="Salaried" checked />
              Salaried
            </label>
            <label class="radio-option">
              <input type="radio" name="incomeType" value="SENP" />
              Self-Employed Non-Professional (SENP)
            </label>
          </div>
        </div>

        <!-- Requested Loan Amount -->
        <div class="form-group">
          <label for="loanAmount">Requested Loan Amount (₹)</label>
          <div class="input-container">
            <i class="fas fa-rupee-sign"></i>
            <input
              type="number"
              id="loanAmount"
              placeholder="Enter loan amount"
            />
          </div>
          <div class="warning" id="loanAmountWarning"></div>
        </div>

        <!-- Monthly Income -->
        <div class="form-group">
          <label for="monthlyIncome">Monthly Income (₹)</label>
          <div class="input-container">
            <i class="fas fa-wallet"></i>
            <input
              type="number"
              id="monthlyIncome"
              placeholder="Enter monthly income"
            />
          </div>
          <div class="warning" id="monthlyIncomeWarning"></div>
        </div>

        <!-- Applicant Age -->
        <div class="form-group">
          <label for="age">Applicant Age (years)</label>
          <div class="input-container">
            <i class="fas fa-user"></i>
            <input type="number" id="age" placeholder="Enter your age" />
          </div>
          <div class="warning" id="ageWarning"></div>
        </div>

        <!-- Annual Interest Rate -->
        <div class="form-group">
          <label for="interestRate">Annual Interest Rate (%)</label>
          <div class="input-container">
            <i class="fas fa-percent"></i>
            <input
              type="number"
              step="0.1"
              id="interestRate"
              placeholder="Enter interest rate"
            />
          </div>
          <div class="warning" id="interestRateWarning"></div>
        </div>

        <!-- Tenure -->
        <div class="form-group">
          <label for="tenure">Tenure (years)</label>
          <div class="input-container">
            <i class="fas fa-calendar-alt"></i>
            <input type="number" id="tenure" placeholder="Enter loan tenure" />
          </div>
          <div class="warning" id="tenureWarning"></div>
        </div>

        <!-- Calculate Button -->
        <button id="calculateBtn" class="btn-calculate">
          <i class="fas fa-calculator"></i> Calculate EMI
        </button>
      </div>

      <!-- ===== RESULTS ===== -->
      <div class="result-container">
        <div class="result-item highlight">
          <span class="result-label">Monthly EMI</span>
          <span class="result-value emi-highlight" id="monthlyEMI">₹ 0.00</span>
        </div>

        <div class="result-item">
          <span class="result-label">Total Interest Payable</span>
          <span class="result-value" id="totalInterest">₹ 0.00</span>
        </div>

        <div class="result-item">
          <span class="result-label">Total Payment (Principal + Interest)</span>
          <span class="result-value" id="totalPayment">₹ 0.00</span>
        </div>
      </div>

      <!-- INFO TEXT -->
      <div class="info-text">
        <i class="fas fa-info-circle"></i>
        Loan eligibility depends on multiple factors including credit score and financial
        history.
      </div>
    </div>
  </div>

  <!--=============================
    JAVASCRIPT
  =============================-->
  <script>
    // Loan criteria definitions
    const loanCriteria = {
      "Personal Loan": [11.0, 30.0, 3, 7, 500000, 21, 55, 21, 70],
      "Home Loan": [8.2, 16.0, 5, 30, 2500000, 23, 50, 23, 60],
      "Property Loan": [9.0, 25.0, 5, 15, 2500000, 23, 50, 23, 60],
      "Business Loan": [17.0, 30.0, 3, 7, 500000, 25, 60, 25, 70],
    };

    // DOM Elements
    const loanType = document.getElementById('loanType');
    const incomeType = document.querySelectorAll('input[name="incomeType"]');
    const loanAmount = document.getElementById('loanAmount');
    const monthlyIncome = document.getElementById('monthlyIncome');
    const age = document.getElementById('age');
    const interestRate = document.getElementById('interestRate');
    const tenure = document.getElementById('tenure');
    const calculateBtn = document.getElementById('calculateBtn');

    // Warning elements
    const loanAmountWarning = document.getElementById('loanAmountWarning');
    const monthlyIncomeWarning = document.getElementById('monthlyIncomeWarning');
    const ageWarning = document.getElementById('ageWarning');
    const interestRateWarning = document.getElementById('interestRateWarning');
    const tenureWarning = document.getElementById('tenureWarning');

    // Result elements
    const monthlyEMI = document.getElementById('monthlyEMI');
    const totalInterest = document.getElementById('totalInterest');
    const totalPayment = document.getElementById('totalPayment');

    // Set default values for inputs based on loan type
    function setDefaultValues() {
      const loanTypeValue = loanType.value;
      const criteria = loanCriteria[loanTypeValue];

      // Pre‐fill minimum loan amount
      loanAmount.value = criteria[4];
      // Pre‐fill midpoint interest rate
      interestRate.value = ((criteria[0] + criteria[1]) / 2).toFixed(1);
      // Pre‐fill midpoint tenure
      tenure.value = Math.floor((criteria[2] + criteria[3]) / 2);

      // Clear other fields
      monthlyIncome.value = '';
      age.value = '';
    }

    // Initialize with default values
    setDefaultValues();

    // Whenever loan type changes, re‐set defaults and revalidate
    loanType.addEventListener('change', function () {
      setDefaultValues();
      validateAll();
    });

    // Revalidate age if income type radio changes
    incomeType.forEach(radio => {
      radio.addEventListener('change', validateAge);
    });

    // Attach input‐event validation
    loanAmount.addEventListener('input', validateLoanAmount);
    monthlyIncome.addEventListener('input', validateMonthlyIncome);
    age.addEventListener('input', validateAge);
    interestRate.addEventListener('input', validateInterestRate);
    tenure.addEventListener('input', validateTenure);

    // Calculate button
    calculateBtn.addEventListener('click', calculateEMI);

    // Clear all warning texts
    function clearWarnings() {
      loanAmountWarning.textContent = '';
      monthlyIncomeWarning.textContent = '';
      ageWarning.textContent = '';
      interestRateWarning.textContent = '';
      tenureWarning.textContent = '';
    }

    // Run all validations
    function validateAll() {
      validateLoanAmount();
      validateMonthlyIncome();
      validateAge();
      validateInterestRate();
      validateTenure();
    }

    // -------- VALIDATION FUNCTIONS --------
    function validateLoanAmount() {
      const val = loanAmount.value.trim();
      loanAmountWarning.textContent = '';

      if (!val) return;
      const amount = parseFloat(val);
      if (isNaN(amount)) {
        loanAmountWarning.textContent = 'Enter a valid number';
        return;
      }

      const loanTypeValue = loanType.value;
      const minAmount = loanCriteria[loanTypeValue][4];
      if (amount < minAmount) {
        loanAmountWarning.textContent = `Minimum loan is ₹${minAmount.toLocaleString()}`;
      }
    }

    function validateMonthlyIncome() {
      const val = monthlyIncome.value.trim();
      monthlyIncomeWarning.textContent = '';

      if (!val) return;
      const income = parseFloat(val);
      if (isNaN(income)) {
        monthlyIncomeWarning.textContent = 'Enter a valid number';
        return;
      }
      if (income <= 0) {
        monthlyIncomeWarning.textContent = 'Income must be > 0';
      }
    }

    function validateAge() {
      const val = age.value.trim();
      ageWarning.textContent = '';

      if (!val) return;
      const ageVal = parseInt(val);
      if (isNaN(ageVal)) {
        ageWarning.textContent = 'Enter a valid age';
        return;
      }

      const loanTypeValue = loanType.value;
      const criteria = loanCriteria[loanTypeValue];
      const incomeTypeValue = document.querySelector('input[name="incomeType"]:checked').value;

      let minAge, maxAge;
      if (incomeTypeValue === 'Salaried') {
        minAge = criteria[5];
        maxAge = criteria[6];
      } else {
        minAge = criteria[7];
        maxAge = criteria[8];
      }

      if (ageVal < minAge || ageVal > maxAge) {
        ageWarning.textContent = `Age must be ${minAge}–${maxAge} yrs`;
        return;
      }

      // Also check closing age if tenure is present
      const tenureVal = tenure.value.trim();
      if (tenureVal) {
        const tInt = parseInt(tenureVal);
        if (!isNaN(tInt)) {
          const closingAge = ageVal + tInt;
          if (incomeTypeValue === 'Salaried' && closingAge > 60) {
            ageWarning.textContent = 'Closing age > 60 yrs (Salaried)';
          } else if (incomeTypeValue === 'SENP' && closingAge > 70) {
            ageWarning.textContent = 'Closing age > 70 yrs (SENP)';
          }
        }
      }
    }

    function validateInterestRate() {
      const val = interestRate.value.trim();
      interestRateWarning.textContent = '';

      if (!val) return;
      const rate = parseFloat(val);
      if (isNaN(rate)) {
        interestRateWarning.textContent = 'Enter a valid rate';
        return;
      }

      const loanTypeValue = loanType.value;
      const minRate = loanCriteria[loanTypeValue][0];
      const maxRate = loanCriteria[loanTypeValue][1];
      if (rate < minRate || rate > maxRate) {
        interestRateWarning.textContent = `Rate must be ${minRate}%–${maxRate}%`;
      }
    }

    function validateTenure() {
      const val = tenure.value.trim();
      tenureWarning.textContent = '';

      if (!val) return;
      const tVal = parseInt(val);
      if (isNaN(tVal)) {
        tenureWarning.textContent = 'Enter a valid tenure';
        return;
      }

      const loanTypeValue = loanType.value;
      const minTenure = loanCriteria[loanTypeValue][2];
      const maxTenure = loanCriteria[loanTypeValue][3];
      if (tVal < minTenure || tVal > maxTenure) {
        tenureWarning.textContent = `Tenure must be ${minTenure}–${maxTenure} yrs`;
        return;
      }

      // Also check closing age if age is present
      const ageVal = age.value.trim();
      if (ageVal) {
        const aInt = parseInt(ageVal);
        if (!isNaN(aInt)) {
          const incomeTypeValue = document.querySelector('input[name="incomeType"]:checked').value;
          const closingAge = aInt + tVal;
          if (incomeTypeValue === 'Salaried' && closingAge > 60) {
            tenureWarning.textContent = 'Closing age > 60 yrs (Salaried)';
          } else if (incomeTypeValue === 'SENP' && closingAge > 70) {
            tenureWarning.textContent = 'Closing age > 70 yrs (SENP)';
          }
        }
      }
    }

    // -------- EMI CALCULATION --------
    function calculateEMI() {
      clearWarnings();
      validateAll();

      // If any warning is present, abort calculation
      const warnings = [
        loanAmountWarning,
        monthlyIncomeWarning,
        ageWarning,
        interestRateWarning,
        tenureWarning
      ];
      if (warnings.some(el => el.textContent !== '')) {
        return;
      }

      const P = parseFloat(loanAmount.value);
      const yearlyRate = parseFloat(interestRate.value);
      const r = yearlyRate / (12 * 100); // monthly decimal rate
      const n = parseInt(tenure.value) * 12;

      let emi;
      if (r > 0) {
        emi = P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
      } else {
        emi = P / n;
      }

      const total = emi * n;
      const interest = total - P;

      monthlyEMI.textContent = `₹ ${emi.toFixed(2)}`;
      totalInterest.textContent = `₹ ${interest.toFixed(2)}`;
      totalPayment.textContent = `₹ ${total.toFixed(2)}`;
    }

    // Run initial validation
    validateAll();
  </script>
</body>
</html>
